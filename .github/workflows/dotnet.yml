name: TankLib
on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]
jobs:
    build:
        runs-on: windows-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0
                    submodules: 'recursive'
            -   name: Install .NET 10
                uses: actions/setup-dotnet@v4
            -   name: Mutate Run Number
                run: |
                  $num = (997+$($Env:GITHUB_RUN_NUMBER))
                  echo "GITHUB_RUN_NUMBER_DELTA=$num" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append
            -   name: Build Release (Windows)
                run: dotnet publish project.traversal -c Release -r win-x64 -o dist/Release/win --self-contained true
            -   name: Build Release (Linux)
                run: dotnet publish project.traversal -c Release -r linux-x64 -o dist/Release/linux
            -   name: Build Release (macOS)
                run: dotnet publish project.traversal -c Release -r osx-arm64 -o dist/Release/osx
                # --self-contained for user experience
            -   name: Upload Release
                uses: actions/upload-artifact@v4
                with:
                    name: toolchain-release-windows
                    path: dist/Release/win
            -   name: Upload Release
                uses: actions/upload-artifact@v4
                with:
                    name: toolchain-release-linux
                    path: dist/Release/linux
            -   name: Upload Release
                uses: actions/upload-artifact@v4
                with:
                    name: toolchain-release-osx
                    path: dist/Release/osx
            -   name: Build Debug (Windows)
                run: dotnet publish project.traversal -c Debug -r win-x64 -o dist/Debug --self-contained true
            -   name: Upload Debug
                uses: actions/upload-artifact@v4
                with:
                    name: toolchain-debug-windows
                    path: dist/Debug
